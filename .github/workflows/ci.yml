name: CI Log Analyzer

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: |
          uv python install 3.15
          uv python pin 3.15

      - name: Sync dependencies
        run: |
          uv sync --python 3.15
          uv sync --dev

      - name: Run flake8
        run: |
          uv run flake8 main.py src/

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: |
          uv python install 3.15
          uv python pin 3.15

      - name: Sync dependencies
        run: |
          uv sync --python 3.15
          uv sync --dev

      - name: Run mypy
        run: |
          uv run mypy main.py src/
